<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 学习伴侣</title>
    <!-- Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 750px;
        }

        /* 头部 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .header h1 { font-size: 22px; margin-bottom: 4px; letter-spacing: 1px; }
        .header p { font-size: 13px; opacity: 0.85; }

        /* 聊天区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f9fc;
        }
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        /* 消息 */
        .message {
            margin-bottom: 16px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { justify-content: flex-end; }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }
        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Markdown 内容样式 */
        .message-bubble p { margin: 0.4em 0; }
        .message-bubble ul, .message-bubble ol { padding-left: 1.5em; margin: 0.4em 0; }
        .message-bubble code {
            background: #f0f0f0;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .message-bubble pre {
            background: #f6f8fa;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.5em 0;
        }
        .message-bubble pre code {
            background: none;
            padding: 0;
        }
        .message-bubble blockquote {
            border-left: 3px solid #667eea;
            padding-left: 10px;
            color: #666;
            margin: 0.5em 0;
        }
        .message-bubble strong { color: #333; }
        .message-bubble table {
            border-collapse: collapse;
            margin: 0.5em 0;
            width: 100%;
        }
        .message-bubble th, .message-bubble td {
            border: 1px solid #ddd;
            padding: 6px 10px;
            text-align: left;
        }
        .message-bubble th { background: #f0f0f0; }

        /* 思维链折叠面板 */
        .thinking-panel {
            background: #f0f4ff;
            border: 1px solid #d0d8f0;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .thinking-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
            color: #667eea;
            user-select: none;
        }
        .thinking-toggle:hover { background: #e8edff; }
        .thinking-toggle .arrow {
            transition: transform 0.2s;
            font-size: 10px;
        }
        .thinking-toggle .arrow.open { transform: rotate(90deg); }
        .thinking-content {
            display: none;
            padding: 10px 14px;
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            border-top: 1px solid #d0d8f0;
        }
        .thinking-content.show { display: block; }

        /* 正在思考动画 */
        .thinking-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .thinking-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .thinking-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 快捷按钮 */
        .quick-actions {
            padding: 8px 20px;
            background: #f7f9fc;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
            border-top: 1px solid #eee;
        }
        .quick-btn {
            padding: 6px 14px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #555;
        }
        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 输入区域 */
        .input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-area input:focus { border-color: #667eea; }
        .input-area button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .input-area button:active { transform: translateY(0); }
        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container { height: 95vh; max-height: none; border-radius: 12px; }
            .header h1 { font-size: 18px; }
            .message-bubble { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI 学习伴侣</h1>
            <p>智能对话 · 任务管理 · 天气查询 · 学习计划</p>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="quick-actions">
            <button class="quick-btn" onclick="sendQuick('你好，帮我制定一个复习计划')">制定复习计划</button>
            <button class="quick-btn" onclick="sendQuick('帮我添加一个任务：明天交软工作业')">添加任务</button>
            <button class="quick-btn" onclick="sendQuick('查看我的所有任务')">查看任务</button>
            <button class="quick-btn" onclick="sendQuick('今天北京天气怎么样')">查询天气</button>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入你的问题，比如"帮我制定下周的复习计划"..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // 配置 marked
        marked.setOptions({
            breaks: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // 添加消息气泡
        function addMessage(content, role) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            if (role === 'assistant') {
                bubble.innerHTML = renderContent(content);
            } else {
                bubble.textContent = content;
            }
            div.appendChild(bubble);
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return bubble;
        }

        // 渲染内容：处理思维链 + Markdown
        function renderContent(text) {
            if (!text) return '';

            // 处理思维链
            const thinkMatch = text.match(/【思考】([\s\S]*?)(?=【回答】|$)/);
            const answerMatch = text.match(/【回答】([\s\S]*?)$/);

            let html = '';

            if (thinkMatch) {
                const thinking = thinkMatch[1].trim();
                const id = 'think-' + Date.now();
                html += `<div class="thinking-panel">
                    <div class="thinking-toggle" onclick="toggleThinking('${id}', this)">
                        <span class="arrow">&#9654;</span>
                        <strong>AI 的思考过程</strong>
                    </div>
                    <div class="thinking-content" id="${id}">${marked.parse(thinking)}</div>
                </div>`;
            }

            const mainContent = answerMatch ? answerMatch[1].trim() : (thinkMatch ? text.replace(/【思考】[\s\S]*?(?=【回答】|$)/, '').replace(/【回答】/, '').trim() : text);
            if (mainContent) {
                html += marked.parse(mainContent);
            }

            return html || marked.parse(text);
        }

        // 切换思维链面板
        function toggleThinking(id, el) {
            const content = document.getElementById(id);
            const arrow = el.querySelector('.arrow');
            content.classList.toggle('show');
            arrow.classList.toggle('open');
        }

        // 创建思考中的气泡
        function createThinkingBubble() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = '<div class="thinking-indicator"><span></span><span></span><span></span></div>';
            div.appendChild(bubble);
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return bubble;
        }

        // 发送消息（流式）
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;

            const bubble = createThinkingBubble();

            try {
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    // 降级到非流式接口
                    const fallbackResp = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: message })
                    });
                    const fallbackData = await fallbackResp.json();
                    bubble.innerHTML = renderContent(fallbackData.message || '抱歉，发生了错误。');
                    chatArea.scrollTop = chatArea.scrollHeight;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.error) {
                                    fullText += '\n\n[错误: ' + data.error + ']';
                                } else if (data.content) {
                                    fullText += data.content;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }

                    if (fullText) {
                        bubble.innerHTML = renderContent(fullText);
                        chatArea.scrollTop = chatArea.scrollHeight;
                    }
                }
            } catch (error) {
                bubble.innerHTML = '网络连接失败，请检查服务是否正常运行。';
            }

            sendBtn.disabled = false;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function sendQuick(text) {
            messageInput.value = text;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !sendBtn.disabled) sendMessage();
        }

        // 欢迎消息
        addMessage('你好！我是 **AI 学习伴侣**，你的智能学习助手。\n\n我可以帮你：\n- 管理学习待办任务\n- 查询城市天气\n- 制定学习计划\n- 回答学习问题\n\n试试下面的快捷按钮，或者直接输入你的问题吧！', 'assistant');
    </script>
</body>
</html>
